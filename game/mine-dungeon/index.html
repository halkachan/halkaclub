<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="HALKAのゲーム「みねだんじょん」。" />
    <title>みねだんじょん | HALKA</title>
    <link rel="icon" href="/favicon.png?v=2" type="image/png" />
    <link rel="stylesheet" href="../../style.css?v=1" />
    <link rel="stylesheet" href="../game.css?v=4" />
  </head>
  <body>
    <main id="top">
      <div class="yellow-tape" aria-hidden="true">
        <span>HALKA GAME</span>
        <span>tap to launch ▶</span>
      </div>

      <div class="notebook">
        <header class="site-header">
          <a class="small-sign" href="../../index.html">HALKA</a>
          <p>みねだんじょん</p>
          <span class="header-doodle" aria-hidden="true">遊　〰</span>
        </header>

        <section class="game-section game-detail" aria-labelledby="game-title">
          <div class="section-heading">
            <div>
              <p>game 02</p>
              <h1 id="game-title">みねだんじょん</h1>
            </div>
            <span aria-hidden="true">🍊　・　🍌</span>
          </div>

          <div class="game-description">
            <p>
              リンちゃんを操作して、敵を避けながら100個のみかんを集めよう🍊<br />
              バナナを拾うと、敵に捕まっても一度だけ復活できます🍌
            </p>
          </div>
          <p class="game-orientation-note">⌨️ キーボード・📱 スマホ対応</p>

          <div class="game-frame-wrap">
            <div class="game-frame game-frame--landscape" data-game-frame>
              <button
                class="game-launch-button"
                type="button"
                data-game-url="https://halkachan.github.io/mine-dungeon/"
                data-game-title="みねだんじょん"
              >
                <span>ゲームを起動</span>
                <span aria-hidden="true">▶</span>
              </button>
            </div>
          </div>

          <div class="game-newtab-wrap">
            <a class="game-newtab-button" href="https://halkachan.github.io/mine-dungeon/" target="_blank" rel="noreferrer">
              <span>別タブで遊ぶ</span>
              <span aria-hidden="true">↗</span>
            </a>
          </div>

          <a class="back-link" href="../index.html">← ゲーム集へ戻る</a>
        </section>
      </div>
    </main>

    <script src="../game.js?v=3" defer></script>
  </body>
</html>
