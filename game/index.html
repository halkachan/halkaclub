  <body>
    <main id="top">
      <div class="yellow-tape" aria-hidden="true">
        <span>HALKA GAME</span>
        <span>choose a game ▶</span>
      </div>

      <div class="notebook">
        <header class="site-header">
          <a class="small-sign" href="../index.html">HALKA</a>
          <p>ゲーム集</p>
          <span class="header-doodle" aria-hidden="true">遊　〰</span>
        </header>

        <section class="game-section" aria-labelledby="game-title">
          <div class="section-heading">
            <div>
              <p>games</p>
              <h1 id="game-title">ゲーム集</h1>
            </div>
            <span aria-hidden="true">♪　・　☆</span>
          </div>

          <p class="game-collection-lead">なんか、変なゲーム</p>

          <div class="game-grid">
            <article class="game-card">
              <p class="game-card-number" aria-hidden="true">01</p>
              <h2>かがみねちゃれんじ</h2>
              <p>
                リンとレンの文字を揃えるルーレットゲーム<br />
                それだけ
              </p>
              <ul class="game-card-tags" aria-label="対応情報">
                <li>スマホ対応</li>
                <li>縦画面推奨</li>
              </ul>
              <a class="game-card-link" href="kagamine-challenge/">
                <span>ゲームページへ</span>
                <span aria-hidden="true">▶</span>
              </a>
            </article>

            <article class="game-card">
              <p class="game-card-number" aria-hidden="true">02</p>
              <h2>ぎゅうぎゅうりんちゃん</h2>
              <p>
                りんちゃんを落として押し出す<br />
                詰まったらパカーッと開けて解決<br />
                それだけ
              </p>
              <ul class="game-card-tags" aria-label="対応情報">
                <li>スマホ対応</li>
                <li>縦画面推奨</li>
                <li>ver 1.2</li>
              </ul>
              <a class="game-card-link" href="gyugyu-rinchan/">
                <span>ゲームページへ</span>
                <span aria-hidden="true">▶</span>
              </a>
            </article>
          </div>

          <a class="back-link" href="../index.html">← リンク集へ戻る</a>
        </section>
      </div>
    </main>
