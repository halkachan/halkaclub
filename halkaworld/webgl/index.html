<!doctype html>
<html lang="ja">

    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e7eecf; }
      #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #485038; font: 14px sans-serif; pointer-events: none; }
      #error { position: absolute; inset: 12px; color: #9c2828; font: 14px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="loading">Loading...</div>
    <div id="error" role="alert"></div>
    <script src="Build/8c0fd4b36ad3678e3d6e03d604f10448.loader.js"></script>
    <script>
      const canvas = document.getElementById("unity-canvas");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      createUnityInstance(canvas, {
        dataUrl: "Build/40126727ffcb0ebd26b799dd8b3b7e22.data",
        frameworkUrl: "Build/08e497040f5189ca4194c694000a828d.framework.js",
        codeUrl: "Build/513e91ed39c2445d97e2abee0b52ab3c.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HALKA",
        productName: "HALKA WORLD",
        productVersion: "1.5",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      }, (progress) => {
        loading.textContent = `Loading... ${Math.round(progress * 100)}%`;
      }).then(() => {
        loading.remove();
        canvas.focus();
      }).catch((message) => {
        loading.remove();
        error.textContent = String(message);
        error.style.display = "block";
      });
    </script>
  </body>
