<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HALKA WORLD</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e7eecf; }
      #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; image-rendering: pixelated; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #485038; font: 14px sans-serif; pointer-events: none; }
      #error { position: absolute; inset: 12px; color: #9c2828; font: 14px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="loading">Loading...</div>
    <div id="error" role="alert"></div>
    <script src="Build/306c4e5ecf14727b684df433b27a7448.loader.js"></script>
    <script>
      const canvas = document.getElementById("unity-canvas");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      // Keep the world near whole multiples of its 576-pixel outdoor art height.
      function pixelRatio() {
        const bounds = canvas.getBoundingClientRect();
        const cssHeight = bounds.height;
        const nativeRatio = Math.min(window.devicePixelRatio || 1, 2);
        // Keep mobile controls at their original UI scale and avoid overlap.
        if (!cssHeight || bounds.width < 800 || cssHeight > bounds.width) return nativeRatio;
        const physicalHeight = cssHeight * nativeRatio;
        const renderHeight = physicalHeight >= 576
          ? 576 * Math.floor(physicalHeight / 576) : physicalHeight;
        return renderHeight / cssHeight;
      }
      createUnityInstance(canvas, {
        dataUrl: "Build/096e1f271bd14a68178e9a2dd636e33f.data",
        frameworkUrl: "Build/36f344eeae93a50f9ae30e7d02892ef7.framework.js",
        codeUrl: "Build/a7194efa5d01636d0eb0e291612e6ded.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HALKA",
        productName: "HALKA WORLD",
        productVersion: "2.5.1",
        devicePixelRatio: pixelRatio()
      }, (progress) => {
        loading.textContent = `Loading... ${Math.round(progress * 100)}%`;
      }).then((unityInstance) => {
        // Unity reads the ratio at startup and again when its canvas is resized.
        const resize = () => { unityInstance.Module.devicePixelRatio = pixelRatio(); };
        new ResizeObserver(resize).observe(canvas);
        resize();
        loading.remove();
        canvas.focus();
      }).catch((message) => {
        loading.remove();
        error.textContent = String(message);
        error.style.display = "block";
      });
    </script>
  </body>
</html>
