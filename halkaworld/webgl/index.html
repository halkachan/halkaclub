<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HALKA WORLD</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e7eecf; }
      #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #485038; font: 14px sans-serif; pointer-events: none; }
      #error { position: absolute; inset: 12px; color: #9c2828; font: 14px sans-serif; display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="loading">Loading...</div>
    <div id="error" role="alert"></div>
    <script src="Build/b0b24f23bee5357b0fe4902fb0a76ed0.loader.js"></script>
    <script>
      const canvas = document.getElementById("unity-canvas");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      createUnityInstance(canvas, {
        dataUrl: "Build/93a59ac45a14546a1426983eb2a1238d.data",
        frameworkUrl: "Build/d3e47362f966d3c897276534c240678c.framework.js",
        codeUrl: "Build/1bc036cf881ab01f65714bdde01315ca.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HALKA",
        productName: "HALKA WORLD",
        productVersion: "2.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      }, (progress) => {
        loading.textContent = `Loading... ${Math.round(progress * 100)}%`;
      }).then(() => {
        loading.remove();
        canvas.focus();
      }).catch((message) => {
        loading.remove();
        error.textContent = String(message);
        error.style.display = "block";
      });
    </script>
  </body>
</html>
