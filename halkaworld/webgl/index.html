<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>はるかわーるど</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e7eecf; }
      #unity-canvas { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; outline: none; image-rendering: pixelated; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #485038; font: 14px sans-serif; pointer-events: none; }
      #error { position: absolute; inset: 12px; color: #9c2828; font: 14px sans-serif; display: none; }
      #safe-area-probe { position: fixed; inset: 0; box-sizing: border-box; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <div id="loading">Loading...</div>
    <div id="error" role="alert"></div>
    <script src="Build/09542a3926ffb8355838d426cce675e5.loader.js"></script>
    <script>
      const canvas = document.getElementById("unity-canvas");
      const loading = document.getElementById("loading");
      const error = document.getElementById("error");
      // はるかわーるど: phones are played upright (as in the 2D game) or sideways; the canvas
      // stays inside the safe area (notch, home indicator) and follows turns and full screen.
      // On a large landscape screen, keep the 576-pixel world projection at exactly one CSS
      // pixel per authored sprite pixel, centred with integer offsets.
      const safeProbe = document.getElementById("safe-area-probe");
      function safeInsets() {
        const style = getComputedStyle(safeProbe);
        const px = (value) => Math.max(0, parseFloat(value) || 0);
        return { top: px(style.paddingTop), right: px(style.paddingRight), bottom: px(style.paddingBottom), left: px(style.paddingLeft) };
      }
      function layoutCanvas() {
        const inset = safeInsets();
        const width = window.innerWidth - inset.left - inset.right;
        const height = window.innerHeight - inset.top - inset.bottom;
        const desktop = width >= 800 && height >= 576 && width >= height;
        // Full screen: this page's own, or the game page's frame made full screen by its button.
        const filling = document.fullscreenElement || (window.innerWidth >= screen.width - 1 && window.innerHeight >= screen.height - 1);
        if (!desktop || filling) {
          canvas.style.left = `${inset.left}px`;
          canvas.style.top = `${inset.top}px`;
          canvas.style.width = `calc(100% - ${inset.left + inset.right}px)`;
          canvas.style.height = `calc(100% - ${inset.top + inset.bottom}px)`;
          return;
        }
        const scale = Math.min(1, 576 / height);
        const canvasWidth = Math.floor(width * scale);
        const canvasHeight = Math.floor(height * scale);
        canvas.style.width = `${canvasWidth}px`;
        canvas.style.height = `${canvasHeight}px`;
        canvas.style.left = `${Math.floor(inset.left + (width - canvasWidth) / 2)}px`;
        canvas.style.top = `${Math.floor(inset.top + (height - canvasHeight) / 2)}px`;
      }
      window.addEventListener("resize", layoutCanvas);
      window.addEventListener("orientationchange", layoutCanvas);
      document.addEventListener("fullscreenchange", layoutCanvas);
      layoutCanvas();
      // Keep the world near whole multiples of its 576-pixel outdoor art height.
      function pixelRatio() {
        const bounds = canvas.getBoundingClientRect();
        const cssHeight = bounds.height;
        const nativeRatio = Math.min(window.devicePixelRatio || 1, 2);
        // Keep mobile controls at their original UI scale and avoid overlap.
        if (!cssHeight || bounds.width < 800 || cssHeight > bounds.width) return nativeRatio;
        const physicalHeight = cssHeight * nativeRatio;
        const renderHeight = physicalHeight >= 576
          ? 576 * Math.floor(physicalHeight / 576) : physicalHeight;
        return renderHeight / cssHeight;
      }
      createUnityInstance(canvas, {
        dataUrl: "Build/3b2e14733cd96566b01afb8a412eab40.data",
        frameworkUrl: "Build/ad8b00ed7fff31f8845e23bb1beaeec9.framework.js",
        codeUrl: "Build/ed2a79cea93b971effbc23ea8ffe8a5f.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HALKA",
        productName: "HALKA WORLD",
        productVersion: "3.0 Preview",
        devicePixelRatio: pixelRatio()
      }, (progress) => {
        loading.textContent = `Loading... ${Math.round(progress * 100)}%`;
      }).then((unityInstance) => {
        // Unity reads the ratio at startup and again when its canvas is resized.
        const resize = () => { layoutCanvas(); unityInstance.Module.devicePixelRatio = pixelRatio(); };
        new ResizeObserver(resize).observe(canvas);
        window.addEventListener("resize", resize);
        resize();
        loading.remove();
        canvas.focus();
      }).catch((message) => {
        loading.remove();
        error.textContent = String(message);
        error.style.display = "block";
      });
    </script>
  </body>
</html>
