<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e7ded6">
    <title>みねはうす</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      // Browser check panel (development use): only with ?debug=1 in the page address.
      if (/(?:^|[?&])debug=1(?:&|$)/.test(location.search)) {
        document.write('<script src="TemplateData/diagnostics.js"><\/script>');
      }
    </script>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="-1" aria-label="みねはうす"></canvas>

    <div id="loading">
      <div id="loading-title">みねはうす</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-text">よみこみ中…</div>
      <div id="loading-credit">この作品は、<a href="https://piapro.jp/license/pcl/summary" target="_blank" rel="noopener">ピアプロ・キャラクター・ライセンス</a>に基づいてクリプトン・フューチャー・メディア株式会社のキャラクター「鏡音リン」「鏡音レン」を描いたものです。非公式の二次創作ゲームです。</div>
    </div>

    <div id="rotate-hint" aria-hidden="true">スマホを横向きにすると、大きく表示されます</div>
    <div id="message" role="alert"></div>
    <div id="lost" role="alertdialog" aria-labelledby="lost-text">
      <div id="lost-card">
        <div id="lost-text">ブラウザが画面の表示を止めました（メモリ不足などで起きることがあります）。<br>
          ページを読み込み直すと続きから遊べます。確定した模様替えは、保存できる環境なら残っています。</div>
        <button type="button" id="lost-reload">読み込み直す</button>
      </div>
    </div>

    <script>
      var canvas = document.getElementById("game-canvas");
      var messageBox = document.getElementById("message");

      // atBottom (v0.5): over the band below the house, which is empty while the save menu is open (the menu's sheet
      // and its close key stay in view); a new message replaces the previous one (errors stay)
      function showMessage(text, isError, atBottom) {
        if (isError && window.mineHouseDiag) window.mineHouseDiag.error(text);
        Array.prototype.slice.call(messageBox.children).forEach(function (old) {
          if (old.className !== "error") messageBox.removeChild(old);
        });
        messageBox.className = atBottom ? "bottom" : "";
        var div = document.createElement("div");
        div.textContent = text;
        if (isError) div.className = "error";
        messageBox.appendChild(div);
        messageBox.style.display = "block";
        // v0.5: removed only if it is still there - an error in the page's own script would stop the game
        // (Unity's loader treats any uncaught error on the page as the game failing)
        if (!isError) setTimeout(function () {
          if (div.parentNode) div.parentNode.removeChild(div);
          if (!messageBox.children.length) messageBox.style.display = "none";
        }, 5000);
      }

      // The page itself never scrolls, zooms or opens a long-press menu over the game.
      // Touches on the game also must not turn into emulated mouse clicks (Unity reads the touches itself).
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      ["touchstart", "touchmove", "touchend"].forEach(function (type) {
        canvas.addEventListener(type, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
      });

      // v0.5: the drawing was taken away (WebGL context lost) - the game cannot draw again by itself
      canvas.addEventListener("webglcontextlost", function () {
        document.getElementById("lost").className = "shown";
        if (window.mineHouseDiag) window.mineHouseDiag.error("WebGL context lost");
      });
      document.getElementById("lost-reload").addEventListener("click", function () { location.reload(); });

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/9c6fb9740aaec7ccddafba2b9ee5ca09.data.unityweb",
        frameworkUrl: buildUrl + "/7e99cee23410564c4bee93d17d073bb1.framework.js.unityweb",
        codeUrl: buildUrl + "/f7c9802a6ca0130d564e6c06f8cec6ca.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HALKA",
        productName: "みねはうす",
        productVersion: "1.0.0",
        showBanner: function (msg, type) { showMessage(msg, type === "error"); },
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/f8902474c07f67538296e3f85200c963.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("loading-fill").style.width = Math.round(100 * progress) + "%";
        }).then(function (instance) {
          window.mineHouse = instance;
          document.getElementById("loading").style.display = "none";
        }).catch(function (message) {
          document.getElementById("loading").style.display = "none";
          showMessage("起動できませんでした: " + message, true);
        });
      };
      script.onerror = function () {
        showMessage("ゲームファイルを読み込めませんでした。", true);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
